server {
    listen 80;
    server_name thejkhouse.com www.thejkhouse.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thejkhouse.com www.thejkhouse.com;

    ssl_certificate /etc/letsencrypt/live/thejkhouse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thejkhouse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/thejkhouse;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
